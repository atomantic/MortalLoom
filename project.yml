name: MortalLoom
options:
  bundleIdPrefix: net.shadowpuppet
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  xcodeVersion: "16.0"
  groupSortPosition: top

settings:
  base:
    DEVELOPMENT_TEAM: TYQ32QCF6K
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: 10
    SWIFT_VERSION: "6.0"
    DEAD_CODE_STRIPPING: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_EMIT_LOC_STRINGS: YES

targets:
  MortalLoom:
    type: application
    platform: [iOS, macOS]
    sources:
      - MortalLoom
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.shadowpuppet.MeatSpaceTracker
        DEVELOPMENT_TEAM: TYQ32QCF6K
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: MortalLoom
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.healthcare-fitness
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: false
        INFOPLIST_KEY_NSHealthShareUsageDescription: "MortalLoom reads your health data to display metrics and trends."
        INFOPLIST_KEY_NSHealthUpdateUsageDescription: "MortalLoom writes health data to keep your records in sync."
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: false
    info:
      path: MortalLoom/App/Info.plist
      properties:
        CFBundleDisplayName: MortalLoom
        LSApplicationCategoryType: public.app-category.healthcare-fitness
        NSHealthShareUsageDescription: "MortalLoom reads your health data to display metrics, trends, and life expectancy calculations. Your data stays on your device."
        NSHealthUpdateUsageDescription: "MortalLoom may write health data to keep your records in sync across apps."
        UILaunchScreen: {}
        ITSAppUsesNonExemptEncryption: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    entitlements:
      path: MortalLoom/App/MortalLoom.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.files.downloads.read-write: true
        com.apple.security.files.bookmarks.app-scope: true
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access:
          - health-records
        com.apple.developer.icloud-container-identifiers:
          - iCloud.net.shadowpuppet.MeatSpaceTracker
        com.apple.developer.icloud-services:
          - CloudDocuments
        com.apple.security.application-groups:
          - group.net.shadowpuppet.MeatSpaceTracker
    dependencies:
      - target: MortalLoomWidget
        embed: true
        platformFilter: iOS

  MortalLoomWidget:
    type: app-extension
    platform: iOS
    sources:
      - MortalLoomWidget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.shadowpuppet.MeatSpaceTracker.widget
        DEVELOPMENT_TEAM: TYQ32QCF6K
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: YES
        INFOPLIST_KEY_CFBundleDisplayName: MortalLoom Widget
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"
    info:
      path: MortalLoomWidget/Info.plist
      properties:
        CFBundleDisplayName: MortalLoom Widget
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: MortalLoomWidget/MortalLoomWidget.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.application-groups:
          - group.net.shadowpuppet.MeatSpaceTracker

  MortalLoomTests_iOS:
    type: bundle.unit-test
    platform: iOS
    sources:
      - MortalLoomTests
    dependencies:
      - target: MortalLoom_iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.shadowpuppet.MeatSpaceTracker.tests

  MortalLoomUITests_iOS:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - MortalLoomUITests
    dependencies:
      - target: MortalLoom_iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.shadowpuppet.MeatSpaceTracker.uitests

  MortalLoomTests_macOS:
    type: bundle.unit-test
    platform: macOS
    sources:
      - MortalLoomTests
    dependencies:
      - target: MortalLoom_macOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.shadowpuppet.MeatSpaceTracker.tests
