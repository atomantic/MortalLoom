name: MeatSpace
options:
  bundleIdPrefix: net.shadowpuppet
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  xcodeVersion: "16.0"
  groupSortPosition: top

settings:
  base:
    DEVELOPMENT_TEAM: TYQ32QCF6K
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: 1
    SWIFT_VERSION: "6.0"
    DEAD_CODE_STRIPPING: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_EMIT_LOC_STRINGS: YES

targets:
  MeatSpace:
    type: application
    platform: [iOS, macOS]
    sources:
      - MeatSpace
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.shadowpuppet.MeatSpaceTracker
        DEVELOPMENT_TEAM: TYQ32QCF6K
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: MeatSpace Tracker
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.healthcare-fitness
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: false
        INFOPLIST_KEY_NSHealthShareUsageDescription: "MeatSpace Tracker reads your health data to display metrics and trends."
        INFOPLIST_KEY_NSHealthUpdateUsageDescription: "MeatSpace Tracker writes health data to keep your records in sync."
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: false
    info:
      path: MeatSpace/App/Info.plist
      properties:
        CFBundleDisplayName: MeatSpace Tracker
        LSApplicationCategoryType: public.app-category.healthcare-fitness
        UILaunchScreen: {}
        ITSAppUsesNonExemptEncryption: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    entitlements:
      path: MeatSpace/App/MeatSpace.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.files.downloads.read-write: true
        com.apple.security.files.bookmarks.app-scope: true
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access:
          - health-records
        com.apple.developer.icloud-container-identifiers:
          - iCloud.net.shadowpuppet.MeatSpaceTracker
        com.apple.developer.icloud-services:
          - CloudDocuments

  MeatSpaceTests_iOS:
    type: bundle.unit-test
    platform: iOS
    sources:
      - MeatSpaceTests
    dependencies:
      - target: MeatSpace_iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.shadowpuppet.MeatSpaceTracker.tests

  MeatSpaceTests_macOS:
    type: bundle.unit-test
    platform: macOS
    sources:
      - MeatSpaceTests
    dependencies:
      - target: MeatSpace_macOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.shadowpuppet.MeatSpaceTracker.tests
