name: MortalLoom
options:
  bundleIdPrefix: net.shadowpuppet
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  xcodeVersion: "16.0"
  groupSortPosition: top

settings:
  base:
    DEVELOPMENT_TEAM: TYQ32QCF6K
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: 37
    SWIFT_VERSION: "6.0"
    DEAD_CODE_STRIPPING: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_EMIT_LOC_STRINGS: YES

schemes:
  MortalLoom_iOS:
    build:
      targets:
        MortalLoom_iOS: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - MortalLoomTests_iOS
        - MortalLoomUITests_iOS
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
  MortalLoom_macOS:
    build:
      targets:
        MortalLoom_macOS: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - MortalLoomTests_macOS
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

targets:
  MortalLoom:
    type: application
    platform: [iOS, macOS]
    sources:
      - MortalLoom
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.shadowpuppet.MeatSpaceTracker
        DEVELOPMENT_TEAM: TYQ32QCF6K
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: MortalLoom
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.healthcare-fitness
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: false
        INFOPLIST_KEY_NSHealthShareUsageDescription: "MortalLoom reads your health data to display metrics and trends."
        INFOPLIST_KEY_NSHealthUpdateUsageDescription: "MortalLoom writes health data to keep your records in sync."
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: false
        # MortalLoom-macOS.entitlements is a manually-maintained file because XcodeGen
        # cannot generate per-SDK entitlements from the `entitlements:` section below.
        # It includes the same shared keys (HealthKit, iCloud, app groups, bookmarks) PLUS
        # macOS App Sandbox keys that are macOS-only and must not appear in the iOS signed
        # entitlements. When shared capabilities change in the `entitlements:` section below,
        # update MortalLoom/App/MortalLoom-macOS.entitlements manually to stay in sync.
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": MortalLoom/App/MortalLoom-macOS.entitlements
    info:
      path: MortalLoom/App/Info.plist
      properties:
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleDisplayName: MortalLoom
        LSApplicationCategoryType: public.app-category.healthcare-fitness
        NSHealthShareUsageDescription: "MortalLoom reads your health data to display metrics, trends, and life expectancy calculations. Your data stays on your device."
        NSHealthUpdateUsageDescription: "MortalLoom may write health data to keep your records in sync across apps."
        NSLocationWhenInUseUsageDescription: "MortalLoom uses your location once to identify your country, which adjusts the life expectancy calculation based on local healthcare and environment. Only the country code is stored — coordinates are never saved or transmitted."
        NSCalendarsFullAccessUsageDescription: "MortalLoom can schedule goal work blocks as events on your calendar so you can plan time for what matters most. Calendar access is only used when you tap 'Add to Calendar'."
        UILaunchScreen: {}
        ITSAppUsesNonExemptEncryption: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleURLTypes:
          - CFBundleURLName: net.shadowpuppet.MeatSpaceTracker
            CFBundleURLSchemes:
              - mortalloom
    entitlements:
      path: MortalLoom/App/MortalLoom.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access:
          - health-records
        com.apple.developer.icloud-container-identifiers:
          - iCloud.net.shadowpuppet.MeatSpaceTracker
        com.apple.developer.icloud-services:
          - CloudDocuments
        com.apple.security.application-groups:
          - group.net.shadowpuppet.MeatSpaceTracker
        com.apple.security.files.bookmarks.app-scope: true
    dependencies:
      - target: MortalLoomWidget
        embed: true
        platformFilter: iOS

  MortalLoomWidget:
    type: app-extension
    platform: iOS
    sources:
      - MortalLoomWidget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.shadowpuppet.MeatSpaceTracker.widget
        DEVELOPMENT_TEAM: TYQ32QCF6K
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: YES
        INFOPLIST_KEY_CFBundleDisplayName: MortalLoom Widget
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"
    info:
      path: MortalLoomWidget/Info.plist
      properties:
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleDisplayName: MortalLoom Widget
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: MortalLoomWidget/MortalLoomWidget.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.application-groups:
          - group.net.shadowpuppet.MeatSpaceTracker

  MortalLoomTests_iOS:
    type: bundle.unit-test
    platform: iOS
    sources:
      - MortalLoomTests
    dependencies:
      - target: MortalLoom_iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.shadowpuppet.MeatSpaceTracker.tests

  MortalLoomUITests_iOS:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - MortalLoomUITests
    dependencies:
      - target: MortalLoom_iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.shadowpuppet.MeatSpaceTracker.uitests

  MortalLoomTests_macOS:
    type: bundle.unit-test
    platform: macOS
    sources:
      - MortalLoomTests
    dependencies:
      - target: MortalLoom_macOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.shadowpuppet.MeatSpaceTracker.tests
